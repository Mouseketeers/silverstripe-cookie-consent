---
Name: cookie-consent--config
---
Mouseketeers\CookieConsent\CookieConsent:
  enable_cookie_consent: true
  disable_default_css: false
  disable_default_js: false
  enable_google_consent_mode: false
  enable_consent_logging: true
  categories:
    necessary:
      enabled: true
      readOnly: true
    analytics:
      enabled: false
    advertisement:
      enabled: false
    functionality:
      enabled: false

SilverStripe\Core\Injector\Injector:
  Psr\SimpleCache\CacheInterface.cookie_consent_config:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: cookie_consent_config
      defaultLifetime: 0